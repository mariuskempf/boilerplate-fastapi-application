[project]
name = "boilerplate-fastapi-application"
version = "0.1.0"
description = "Brief project description."
authors = [{name = "Marius Kempf", email = "email-address"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.10.1",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pre-commit==4.2.0",
    "pylint==3.3.7",
    "pytest==8.1.1",
    "shellcheck-py>=0.10.0.1",
    "ipython>=8.37.0",
    "ipykernel>=6.30.0",
    "black[jupyter]>=25.1.0",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[tool.black]
line-length = 120
target-version = ["py312"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["app"]

[tool.pylint.main]
max-line-length = 120
ignore = ["tests", "notebooks"]
ignore-paths = []
load-plugins = []

[tool.pylint.messages_control]
disable = []
